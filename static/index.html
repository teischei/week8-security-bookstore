<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Bookstore Reviews</title>
</head>
<body>
  <h1>Reviews</h1>
  <div id="reviews"></div>
  <script>
    // render review text as text instead of markup
    async function load(bookId) {
      const res = await fetch('/reviews/' + bookId);
      const reviews = await res.json();
      const box = document.getElementById('reviews');
      box.replaceChildren();
      reviews.forEach(t => {
        const paragraph = document.createElement('p');
        paragraph.textContent = t;
        box.appendChild(paragraph);
      });
    }
    load(1);
  </script>
</body>
</html>
